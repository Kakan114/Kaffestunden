<body>

  <!-- Meny -->
  <header class="main-header">
    <div class="brand">

    <button class="nav-toggle" aria-label="Meny" aria-controls="main-nav" aria-expanded="false">☰</button>

    <!-- Navigationsmeny -->
    <nav>
      <ul id="main-nav" class="main-nav">
        <li><a href="index.html#meny">Meny</a></li>

  <section class="profil-container">
    <img src="William.jpeg" alt="William" class="profil-bild" />

    <div class="slide"><img src="kaffe3.jpg" alt="Bild 3" /></div>
    <div class="slide"><img src="kaffe4.jpg" alt="Bild 4" /></div>
    <button class="prev" onclick="changeSlide(-1)">&#10094;</button>
    <button class="next" onclick="changeSlide(1)">&#10095;</button>
