<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kontakt – Kaffestunden</title>
    <link rel="stylesheet" href="Rutor.css" />
  </head>
  <body>
    <header class="main-header">
      <div class="brand">
        <h1>KaffeStunden</h1>
      </div>
    </header>

    <main class="wrap">
      <h2>Kontakt</h2>
      <p class="lead">Hör av dig – vi svarar snabbt.</p>

      <p id="form-status" hidden>Tack, skickat!</p>

      <form id="contact-form" novalidate>
        <div>
          <label for="name">Namn*</label>
          <input
            id="name"
            name="name"
            type="text"
            required
            placeholder="Ditt namn"
          />
          <small class="error" id="name-error" hidden
            >Minst 2 tecken krävs.</small
          >
        </div>

        <div>
          <label for="email">E-post*</label>
          <input
            id="email"
            name="email"
            type="email"
            required
            placeholder="namn@example.com"
          />
          <small class="error" id="email-error" hidden>invalid email</small>
        </div>

        <div>
          <label for="phone">Telefon</label>
          <input
            id="phone"
            name="phone"
            type="tel"
            placeholder="070 123 45 67"
          />
          <small class="error" id="phone-error" hidden
            >Ogiltigt telefonnummer.</small
          >
        </div>

        <div>
          <label for="message">Meddelande*</label>
          <textarea
            id="message"
            name="message"
            rows="5"
            required
            placeholder="Skriv ditt ärende..."
          ></textarea>
          <small class="error" id="message-error" hidden
            >Minst 10 tecken krävs.</small
          >
        </div>

        <button type="submit">Skicka</button>
      </form>
    </main>

    <script src="contact.js" defer></script>
  </body>
</html>
